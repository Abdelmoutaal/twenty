name: Owner-scope server image

on:
  workflow_dispatch:
  push:
    branches: [feat/owner-scope]

permissions:
  contents: read

# Role id used by owner-scope.integration-spec.ts; the server under test reads it at query time
env:
  OWNER_SCOPED_ROLE_IDS: 6f1e2b4a-0c3d-4e5f-8a9b-1c2d3e4f5a6b

jobs:
  owner-scope-integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Build server and dependencies
        run: |
          npx nx build twenty-shared
          npx nx build twenty-emails
          npx nx build twenty-server
      - name: Create test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE "test";'
      - name: Reset and seed test database
        working-directory: packages/twenty-server
        run: NODE_OPTIONS="--max-old-space-size=12288 --import tsx/esm" npx nx database:reset
      - name: Run owner-scope tests
        working-directory: packages/twenty-server
        run: |
          npx jest src/engine/twenty-orm/utils/__tests__/apply-owner-scope.util.spec.ts
          NODE_OPTIONS="--max-old-space-size=6144" npx jest --config ./jest-integration.config.ts --testPathPattern owner-scope

  build-and-push:
    needs: owner-scope-integration-test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          build-args: APP_VERSION=2.32.0-owner-scope
          push: true
          # Docker image names must be lowercase; the sha tag is immutable, pin it in production
          tags: |
            ghcr.io/abdelmoutaal/twenty:v2.32.0-owner-scope
            ghcr.io/abdelmoutaal/twenty:v2.32.0-owner-scope-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
